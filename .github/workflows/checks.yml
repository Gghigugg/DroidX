name: checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [ig-agent-os-rebuild]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run test
      - run: npm run build
